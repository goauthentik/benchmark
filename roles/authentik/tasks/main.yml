---
- name: Create authentik directories
  ansible.builtin.file:
    path: "{{ authentik_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - data
    - certs
    - custom-templates
    - blueprints

- name: Copy compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ authentik_dir }}/compose.yml"
    mode: "0644"

- name: Write environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ authentik_dir }}/.env"
    mode: "0600"

- name: Upload generated test-data blueprint
  ansible.builtin.copy:
    src: "{{ blueprint_file }}"
    dest: "{{ authentik_dir }}/blueprints/test-data.yaml"
    mode: "0644"

- name: Deploy authentik stack
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_dir }}"
    state: present
    pull: always
    remove_orphans: true
