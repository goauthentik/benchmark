---
x-logging: &logging
  # Sent to Loki on the metrics host. Non-blocking so a Loki outage cannot stall
  # the containers being benchmarked; Docker keeps a local copy for docker logs.
  driver: loki
  options:
    loki-url: "${LOKI_URL:?loki url required}/loki/api/v1/push"
    loki-external-labels: "stack=authentik,container={{.Name}},host=${LOKI_HOST:-unknown}"
    loki-retries: "2"
    mode: non-blocking
    max-buffer-size: 4m

services:
  postgresql:
    logging: *logging
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    command: "-c max_connections=500"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    volumes:
      - database:/var/lib/postgresql/data
  postgres-exporter:
    logging: *logging
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    # Collectors that are off by default but carry the table, vacuum and
    # transaction detail the PostgreSQL dashboard asks for.
    command:
      - --collector.long_running_transactions
      - --collector.postmaster
      - --collector.process_idle
      - --collector.stat_activity
      - --collector.stat_activity_autovacuum
      - --collector.stat_checkpointer
      - --collector.stat_progress_vacuum
      - --collector.stat_user_tables
      - --collector.stat_wal_receiver
      - --collector.statio_user_indexes
      - --collector.statio_user_tables
    environment:
      DATA_SOURCE_NAME: postgresql://${PG_USER:-authentik}:${PG_PASS}@postgresql:5432/${PG_DB:-authentik}?sslmode=disable
    ports:
      # Scraped by Prometheus on the metrics host.
      - ${COMPOSE_PORT_PG_EXPORTER:-9187}:9187
  server:
    logging: *logging
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.0}
    ports:
      - ${COMPOSE_PORT_HTTP:-9000}:9000
      - ${COMPOSE_PORT_HTTPS:-9443}:9443
    # Scraped by Prometheus on the metrics host.
      - ${COMPOSE_PORT_METRICS:-9300}:9300
    restart: unless-stopped
    shm_size: 512mb
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
  worker:
    logging: *logging
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.0}
    restart: unless-stopped
    shm_size: 512mb
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
      - ./blueprints:/blueprints/local
volumes:
  database:
    driver: local
