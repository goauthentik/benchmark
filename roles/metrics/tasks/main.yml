---
- name: Create metrics directories
  ansible.builtin.file:
    path: "{{ metrics_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - prometheus
    - grafana/provisioning
    - grafana/provisioning/datasources
    - grafana/provisioning/dashboards
    - grafana/dashboards

- name: Copy compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ metrics_dir }}/compose.yml"
    mode: "0644"

- name: Write environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ metrics_dir }}/.env"
    mode: "0644"

- name: Copy Grafana datasource provisioning
  ansible.builtin.copy:
    src: grafana/datasources/
    dest: "{{ metrics_dir }}/grafana/provisioning/datasources/"
    mode: "0644"
  notify: Reload Grafana

- name: Write the Prometheus datasource
  ansible.builtin.template:
    src: datasources/prometheus.yml.j2
    dest: "{{ metrics_dir }}/grafana/provisioning/datasources/prometheus.yml"
    mode: "0644"
  notify: Reload Grafana

- name: Copy Grafana dashboard provider
  ansible.builtin.copy:
    src: grafana/providers/dashboards.yml
    dest: "{{ metrics_dir }}/grafana/provisioning/dashboards/dashboards.yml"
    mode: "0644"
  notify: Reload Grafana

- name: Copy Grafana dashboards
  ansible.builtin.copy:
    src: grafana/dashboards/
    dest: "{{ metrics_dir }}/grafana/dashboards/"
    mode: "0644"
  notify: Reload Grafana

# node-exporter and cAdvisor describe a machine, and two inventory hosts can be
# two authentik stacks on one machine, so they are scraped once per address. The
# first inventory name wins: what has been collected so far is combined on top,
# so an address that was already seen keeps the name it got.
- name: Map each machine to one inventory name
  ansible.builtin.set_fact:
    metrics_machines: "{{ {machine_address: item} | combine(metrics_machines | default({})) }}"
  loop: "{{ (groups['metrics'] + groups['authentik'] + groups['tests']) | unique }}"
  vars:
    machine_address: "{{ hostvars[item].ansible_host | default(item) }}"

- name: Write Tempo configuration
  ansible.builtin.template:
    src: tempo.yml.j2
    dest: "{{ metrics_dir }}/tempo.yaml"
    mode: "0644"
  notify: Reload Tempo

- name: Write Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ metrics_dir }}/prometheus.yml"
    mode: "0644"
  notify: Reload Prometheus

- name: Deploy metrics stack
  community.docker.docker_compose_v2:
    project_src: "{{ metrics_dir }}"
    state: present
    pull: always
    remove_orphans: true
