---
apiVersion: 1
providers:
  - name: benchmarks
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      # Host side of this path is grafana/dashboards in the metrics directory.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
