---
apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    uid: tempo
    url: http://tempo:3200
    jsonData:
      # Tempo's metrics-generator remote-writes the service graph and span
      # metrics into Prometheus, so the graph is drawn from queries against it.
      serviceMap:
        datasourceUid: prometheus
      # The service map renders as a node graph, so this has to be on for it.
      nodeGraph:
        enabled: true
      # A span has no log labels to join on, so this jumps to the stack's logs
      # for the span's own time range and leaves the filtering to the query.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -2s
        spanEndTimeShift: 2s
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{stack="authentik"}'
