---
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    uid: loki
    url: http://loki:3100
    jsonData:
      # k6 logs the trace id of every login flow it marks as sampled, so those
      # lines get a button straight into the trace.
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: 'traceID=([0-9a-f]{32})'
          url: '$${__value.raw}'
          datasourceUid: tempo
