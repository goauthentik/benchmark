---
services:
  prometheus:
    image: quay.io/prometheus/prometheus:latest
    restart: unless-stopped
    command:
      - --enable-feature=native-histograms
      - --web.enable-remote-write-receiver
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      # Reachable from the k6 host, which remote-writes its results here.
      - ${METRICS_BIND_ADDRESS:-0.0.0.0}:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus:/prometheus
    user: root

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      # The authentik and k6 hosts push their container logs here.
      - ${METRICS_BIND_ADDRESS:-0.0.0.0}:${LOKI_PORT:-3100}:3100
    volumes:
      # Named volume because the image runs as an unprivileged user.
      - loki-data:/loki

  pyroscope:
    image: grafana/pyroscope:latest
    restart: unless-stopped
    ports:
      # authentik sends its profiles here via AUTHENTIK_PYROSCOPE_HOST.
      - ${METRICS_BIND_ADDRESS:-0.0.0.0}:${PYROSCOPE_PORT:-4040}:4040
    volumes:
      # Named volumes because the image runs as an unprivileged user.
      - pyroscope-data:/data
      - pyroscope-compactor:/data-compactor
      - pyroscope-metastore:/data-metastore

  tempo:
    image: grafana/tempo:latest
    restart: unless-stopped
    command: -config.file=/etc/tempo.yaml
    ports:
      # The authentik hosts export their spans here. Tempo's own API on 3200 is
      # not published: Grafana queries it and Prometheus scrapes it over this
      # compose network.
      - ${METRICS_BIND_ADDRESS:-0.0.0.0}:${TEMPO_OTLP_PORT:-4318}:4318
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      # Named volume because the image runs as an unprivileged user.
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # summary.json is a v2 schema dashboard, which needs these before Grafana
      # will provision it. Default-on from Grafana 13, required before that.
      GF_FEATURE_TOGGLES_ENABLE: kubernetesDashboards,dashboardNewLayouts
    ports:
      - ${METRICS_BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  loki-data:
    driver: local
  tempo-data:
    driver: local
  pyroscope-data:
    driver: local
  pyroscope-compactor:
    driver: local
  pyroscope-metastore:
    driver: local
