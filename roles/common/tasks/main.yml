---
- name: Fail early on unsupported distributions
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == "Debian"
    fail_msg: "This role installs Docker from the Debian/Ubuntu apt repository, found {{ ansible_facts['distribution'] }}."

- name: Install base packages
  ansible.builtin.apt:
    # python3-debian is needed by the deb822_repository module.
    name: "{{ common_packages + ['ca-certificates', 'curl', 'python3-debian'] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker apt signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ common_docker_apt_architectures[ansible_facts['architecture']] | default('amd64') }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ common_docker_packages }}"
    state: present
    update_cache: true

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Allow the connecting user to use Docker without sudo
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when:
    - ansible_user is defined
    - ansible_user != "root"
