---
runner_dir: "{{ benchmark_root }}/runner"

# The tests to run, one entry per test. Only name is required; every other key
# falls back to the matching runner_* default below, so `-e runner_vus=32`
# still moves the whole list at once.
#
# A role default, not a group_vars/all.yml var, so that setting benchmark_tests
# in the inventory's `all: vars:` actually overrides it - group_vars/* outranks
# vars set directly in the inventory file, even for the same group.
#
#   name             unique, [a-z0-9-]. Becomes the k6 testid label, the compose
#                    service name and the JSON output file name.
#   script           file under roles/runner/files/tests.
#   target           host in the authentik group this test drives.
#   runner           host in the tests group that generates the load.
#   profile          quick (bounded, blocks the playbook) or burn (background).
#   vus              virtual users.
#   iterations       logins per VU, quick only.
#   flow             flow slug the test walks.
#   quick_duration   cap on a quick run that cannot finish its iterations.
#   burn_duration    cap on a burn run, effectively unlimited by default.
#
# Two tests may share a target - they then compete for it, which is the point of
# a mixed-load run - but each name must be unique, because that is what the
# dashboards split on.
benchmark_tests:
  - name: login

# Fallbacks for every key a test in benchmark_tests leaves out.
runner_script: login.ts
# The authentik host a test drives, and the k6 host that drives it.
runner_target: "{{ groups['authentik'] | first }}"
runner_runner: "{{ groups['tests'] | first }}"
# Flow slug the test drives. A flow with MFA also needs static tokens on the
# generated users to match the code in login.ts.
runner_flow: default-authentication-flow

# quick: every VU runs runner_iterations logins, then k6 exits. Started by
#        runner_run_tests, and blocks until it finishes.
# burn:  the scenario keeps looping in a background container until stopped.
runner_profile: quick
# Logins per VU, so a quick run does vus * iterations logins.
runner_iterations: 1000
# Safety net if the target cannot get through the iterations in time.
runner_quick_duration: 150s
runner_burn_duration: 8760h
runner_vus: 8

# Share of login flows k6 marks as sampled in the traceparent header it sends.
# authentik's sampler is parent-based, so this - not authentik's own sample rate -
# decides how many of the benchmark's requests end up in Tempo. Sending the header
# costs nothing when authentik is not instrumented, so it is on by default.
runner_trace_sample_rate: 0.01

# k6's web dashboard, one port per test on the host so concurrent burn tests do
# not collide. Tests are numbered in the order they appear in benchmark_tests.
runner_dashboard_port_base: 5665

# The quick benchmark takes several minutes, so it only runs when asked for.
runner_run_tests: false
# Set to absent to stop the burn tests.
runner_burn_state: present

# Container name of the single-test burn service this role used to generate,
# removed on upgrade so it cannot keep loading a target unnoticed.
runner_legacy_burn_container: "{{ runner_dir | basename }}-k6-burn-1"
