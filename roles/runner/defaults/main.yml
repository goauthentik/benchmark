---
runner_dir: "{{ benchmark_root }}/runner"
runner_vus: 8
runner_bench_host: "{{ authentik_address }}"
runner_bench_port: "{{ authentik_port_http }}"
# Flow slugs the scenarios drive. The MFA flow needs an authenticator validation
# stage backed by static tokens; the default flow ships with authentik.
runner_flow_no_mfa: default-authentication-flow
runner_flow_with_mfa: default-authentication-mfa-flow

# quick: each scenario runs for runner_quick_duration seconds, in sequence, then
#        k6 exits. Started by runner_run_tests, and blocks until it finishes.
# burn:  all scenarios run at once in a background container until stopped.
runner_profile: quick
runner_quick_duration: 150
runner_burn_duration: 8760h

# The quick benchmark takes several minutes, so it only runs when asked for.
runner_run_tests: false
# Set to absent to stop a running burn test.
runner_burn_state: present
