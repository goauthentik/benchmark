---
runner_dir: "{{ benchmark_root }}/runner"
runner_vus: 8
runner_bench_host: "{{ authentik_address }}"
runner_bench_port: "{{ authentik_port_http }}"
# Flow slug the test drives. A flow with MFA also needs static tokens on the
# generated users to match the code in login.ts.
runner_flow: default-authentication-flow

# quick: the scenario runs for runner_quick_duration seconds, then k6 exits.
#        Started by runner_run_tests, and blocks until it finishes.
# burn:  the scenario runs in a background container until stopped.
runner_profile: quick
runner_quick_duration: 150
runner_burn_duration: 8760h

# The quick benchmark takes several minutes, so it only runs when asked for.
runner_run_tests: false
# Set to absent to stop a running burn test.
runner_burn_state: present
