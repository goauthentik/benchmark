---
x-logging: &logging
  # Sent to Loki on the metrics host. Non-blocking so a Loki outage cannot stall
  # the containers being benchmarked; Docker keeps a local copy for docker logs.
  driver: loki
  options:
    loki-url: "${LOKI_URL:?loki url required}/loki/api/v1/push"
    loki-external-labels: "stack=runner,container={{.Name}},host=${LOKI_HOST:-unknown}"
    loki-retries: "2"
    mode: non-blocking
    max-buffer-size: 4m

x-k6-env: &k6-env
  K6_PROMETHEUS_RW_SERVER_URL: ${HOSTNAME_METRICS}/api/v1/write
  K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: true
  K6_PROMETHEUS_RW_PUSH_INTERVAL: 1s
  K6_WEB_DASHBOARD: true
  K6_WEB_DASHBOARD_HOST: 0.0.0.0
  BENCH_HOST: ${BENCH_HOST:?authentik host required}
  BENCH_PORT: ${BENCH_PORT:-9000}
  VUS: ${VUS:-8}
  FLOW: ${FLOW:-default-authentication-flow}
  QUICK_DURATION: ${QUICK_DURATION:-150}
  BURN_DURATION: ${BURN_DURATION:-8760h}

x-k6: &k6
  image: grafana/k6
  logging: *logging
  volumes:
    - ./outputs:/data/output
    - ./tests:/data/tests

services:
  # Fixed-time run, exits when the scenario is done.
  k6:
    <<: *k6
    profiles: [quick]
    environment:
      <<: *k6-env
      PROFILE: quick
    ports:
      - 5665:5665
    command: >
      run
      --out experimental-prometheus-rw
      --out "json=/data/output/output.json"
      /data/tests/login.ts

  # Runs until stopped. No JSON output, that file would grow without bound.
  k6-burn:
    <<: *k6
    profiles: [burn]
    restart: unless-stopped
    environment:
      <<: *k6-env
      PROFILE: burn
    ports:
      - 5665:5665
    command: >
      run
      --out experimental-prometheus-rw
      /data/tests/login.ts
