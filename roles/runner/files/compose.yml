---
x-k6-env: &k6-env
  K6_PROMETHEUS_RW_SERVER_URL: ${HOSTNAME_METRICS}/api/v1/write
  K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: true
  K6_PROMETHEUS_RW_PUSH_INTERVAL: 1s
  K6_WEB_DASHBOARD: true
  K6_WEB_DASHBOARD_HOST: 0.0.0.0
  BENCH_HOST: ${BENCH_HOST:?authentik host required}
  BENCH_PORT: ${BENCH_PORT:-9000}
  VUS: ${VUS:-8}
  FLOW_NO_MFA: ${FLOW_NO_MFA}
  FLOW_WITH_MFA: ${FLOW_WITH_MFA}
  QUICK_DURATION: ${QUICK_DURATION:-150}
  BURN_DURATION: ${BURN_DURATION:-8760h}

x-k6: &k6
  image: grafana/k6
  volumes:
    - ./outputs:/data/output
    - ./tests:/data/tests

services:
  # Fixed-time run, one scenario after the other, exits when done.
  k6:
    <<: *k6
    profiles: [quick]
    environment:
      <<: *k6-env
      PROFILE: quick
    ports:
      - 5665:5665
    command: >
      run
      --out experimental-prometheus-rw
      --out "json=/data/output/output.json"
      /data/tests/login.js

  # Runs all scenarios until stopped. No JSON output, that file would grow
  # without bound.
  k6-burn:
    <<: *k6
    profiles: [burn]
    restart: unless-stopped
    environment:
      <<: *k6-env
      PROFILE: burn
    ports:
      - 5665:5665
    command: >
      run
      --out experimental-prometheus-rw
      /data/tests/login.js
