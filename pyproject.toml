[project]
name = "benchmarks"
version = "0.1.0"
description = "authentik benchmark harness"
readme = "README.md"
authors = [
    { name = "Jens Langhammer", email = "jens.langhammer@beryju.org" }
]
requires-python = ">=3.14"
dependencies = [
    "ansible-core>=2.21.3",
    "faker>=40.36.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
# Not a Python package - gen-blueprint.py is a standalone script run by Ansible.
package = false

[dependency-groups]
dev = [
    "ansible-lint>=26.8.0",
]
