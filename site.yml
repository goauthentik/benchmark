---
- name: Generate benchmark fixtures
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [fixtures]
  tasks:
    - name: Record when this run started
      ansible.builtin.set_fact:
        benchmark_run_started_ms: "{{ (now(utc=true).timestamp() * 1000) | int }}"

    - name: Create fixtures directory
      ansible.builtin.file:
        path: "{{ fixtures_dir }}"
        state: directory
        mode: "0755"

    - name: Generate the test-data blueprint and matching k6 credentials
      ansible.builtin.command:
        cmd: >-
          uv run python gen-blueprint.py
          --users {{ fixture_users }} --seed {{ fixture_seed }}
          --output {{ blueprint_file }} --credentials {{ credentials_file }}
        chdir: "{{ playbook_dir }}"
        creates: "{{ credentials_file }}"

- name: Provision all benchmark hosts
  hosts: metrics:authentik:tests
  become: true
  roles:
    - common
    - host_metrics

- name: Deploy the metrics stack
  hosts: metrics
  become: true
  roles:
    - metrics

- name: Deploy authentik
  hosts: authentik
  become: true
  roles:
    - authentik

- name: Deploy the k6 test runner
  hosts: tests
  become: true
  roles:
    - runner

# A region annotation covering the run, so dashboards show when the deployment
# touched the stacks and results either side may not be comparable.
- name: Annotate the run in Grafana
  hosts: metrics
  gather_facts: false
  vars:
    annotation_start: "{{ hostvars['localhost']['benchmark_run_started_ms'] | default((now(utc=true).timestamp() * 1000) | int) }}"
    annotation_revision: "{{ lookup('pipe', 'git -C ' ~ playbook_dir ~ ' describe --always --dirty 2>/dev/null || echo unknown') }}"
    annotation_body:
      time: "{{ annotation_start | int }}"
      timeEnd: "{{ (now(utc=true).timestamp() * 1000) | int }}"
      tags: [ansible, deploy]
      text: "Ansible run on {{ ansible_play_hosts_all | join(', ') }} at {{ annotation_revision }}"
  tasks:
    - name: Create the deploy annotation
      ansible.builtin.uri:
        url: "http://localhost:{{ metrics_grafana_port }}/api/annotations"
        method: POST
        body_format: json
        # Serialised here so the timestamps stay JSON numbers rather than strings.
        body: "{{ annotation_body | combine({'time': annotation_body.time | int, 'timeEnd': annotation_body.timeEnd | int}) | to_json }}"
        status_code: 200
      register: annotation
      # Grafana may still be restarting from the provisioning handler.
      until: annotation is success
      retries: 10
      delay: 3
